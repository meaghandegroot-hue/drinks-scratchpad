<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drinks Scratchpad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one column. Orders to ring in, then orders to bring out. A dictation box is pinned at the thumb; a sheet opens to check the split. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#E1E7EA; --ink:#16232D; --ink-soft:#52626E; --line:#CAD3D9;
  --felt:#1E6B4E; --felt-ink:#FFFFFF; --felt-soft:#D6EBE1; --brass:#8A5A00; --brass-soft:#F6E7C4; --danger:#A3261F; --scrim:rgba(9,18,24,.55);
  --font-display:"Zilla Slab",Georgia,"Times New Roman",serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E181F; --surface:#17252E; --surface-2:#223540; --ink:#E8F0F3; --ink-soft:#9FB2BC; --line:#2E434F;
    --felt:#4DBB92; --felt-ink:#06201A; --felt-soft:#163A2D; --brass:#F0C46A; --brass-soft:#3B2E10; --danger:#FF9A90; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181F; --surface:#17252E; --surface-2:#223540; --ink:#E8F0F3; --ink-soft:#9FB2BC; --line:#2E434F;
  --felt:#4DBB92; --felt-ink:#06201A; --felt-soft:#163A2D; --brass:#F0C46A; --brass-soft:#3B2E10; --danger:#FF9A90; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--font-body);-webkit-text-size-adjust:100%;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
html.lock{overflow:hidden}
p,h1,h2{margin:0}
.gutter{max-width:640px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .gutter{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.ttl{display:grid;gap:2px;min-width:0}
.sub:empty{display:none}
#tabsBtn{min-height:46px;flex:none}
.tl{font-size:18px;line-height:1.3}
h1{font:700 25px/1.1 var(--font-display);letter-spacing:.01em}
.sub{color:var(--ink-soft);font-size:15px;white-space:nowrap}

main.gutter{padding-top:14px;padding-bottom:calc(var(--jot-h,200px) + 24px + env(safe-area-inset-bottom,0px))}
.list{display:grid;gap:10px}
.sec{display:flex;align-items:center;gap:10px;padding-top:8px;font:600 19px/1 var(--font-display);color:var(--ink-soft)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:grid;gap:6px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card.done{background:transparent;border-style:dashed}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.body{display:grid;gap:2px;min-width:0}
.name{font:700 21px/1.2 var(--font-body)}
.what{font-size:21px;line-height:1.25}
.qty{font-weight:700;color:var(--brass)}
.to{font-size:17px;color:var(--ink-soft)}
.to b{font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;margin-right:8px;color:var(--brass)}
.av{-webkit-appearance:none;appearance:none;width:60px;height:60px;padding:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink-soft);overflow:hidden;cursor:pointer;display:grid;place-items:center;font:700 24px/1 var(--font-display);touch-action:manipulation}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.av .plus{font:700 11px/1.1 var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.acts{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:6px}
.pay-badge{display:inline-block;margin-left:10px;padding:4px 8px;border-radius:6px;font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
.pay-badge.cash{background:var(--felt-soft);color:var(--ink)}
.pay-badge.tab{background:var(--brass-soft);color:var(--brass)}
.empty{display:grid;gap:12px;padding:24px 0}
.empty h2{font:700 28px/1.15 var(--font-display);text-wrap:balance}
.empty p{max-width:38ch}
.empty q{font-style:normal;font-weight:700}

.btn{-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1 var(--font-body);min-height:48px;padding:0 16px;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink);min-height:54px;font-size:18px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.input{width:100%;min-width:0;min-height:50px;padding:10px 14px;font:400 18px/1.3 var(--font-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--ink-soft)}
.input:focus-visible{outline:3px solid var(--felt);outline-offset:1px;border-color:var(--felt)}
textarea.input{display:block;resize:none;min-height:68px;line-height:1.35}
.err{color:var(--danger);font-weight:700}
.err:empty{display:none}

.jot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.jot .gutter{display:grid;gap:8px;padding-top:10px;padding-bottom:10px}
.jrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}

.tail{display:flex;justify-content:center;padding-top:14px}
.toast{position:fixed;left:0;right:0;bottom:calc(var(--jot-h,200px) + 10px + env(safe-area-inset-bottom,0px));z-index:7;pointer-events:none}
.toast .msg{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700}
.toast button{-webkit-appearance:none;appearance:none;min-height:44px;padding:0 6px;border:0;background:transparent;color:var(--bg);font:700 16px/1 var(--font-body);text-decoration:underline;cursor:pointer}

.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:640px;max-height:94%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{font:700 24px/1.2 var(--font-display)}
.rows{display:grid;gap:12px}
.rrow{display:grid;gap:8px;padding:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px}
.rrow.bad{border-color:var(--danger)}
.rtop{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{-webkit-appearance:none;appearance:none;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:700 17px/1 var(--font-body);cursor:pointer;touch-action:manipulation}
.seg[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.seg:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}


.quick{display:grid;grid-template-columns:56px 56px 56px minmax(0,1fr);gap:8px}
.quick .btn{padding:0;font-size:26px;min-height:54px}
.quick .btn.primary{font-size:17px;padding:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:empty{display:none}
.chip{-webkit-appearance:none;appearance:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--felt);background:var(--felt-soft);color:var(--ink);border-radius:999px;min-height:48px;padding:0 14px;font:400 17px/1.2 var(--font-body);cursor:pointer;touch-action:manipulation;max-width:100%}
.chip.hasimg{padding-left:4px}
.chip img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.seg.big{min-height:54px;font-size:19px}
.flab{display:grid;gap:6px;font-weight:700;font-size:15px}
.flab .hint{font-weight:400;color:var(--ink-soft)}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.step{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:8px}
.step .btn{padding:0;font-size:26px;min-height:50px}
.step .input{text-align:center;font-weight:700}
.sheet.q{display:flex;flex-direction:column;overflow:hidden;gap:0;padding-bottom:0}
.sheet.q .sbody{display:grid;gap:12px;overflow:auto;min-height:0;padding-bottom:12px}
.sheet.q .sfoot{display:grid;gap:8px;padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg{transition:background-color .12s,color .12s}
  .sheet{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top">
  <div class="gutter">
    <div class="ttl">
      <h1>Drinks Scratchpad</h1>
      <span class="sub" id="sub"></span>
    </div>
    <button class="btn" id="tabsBtn" type="button" aria-haspopup="dialog" aria-label="Open tabs">Tabs</button>
  </div>
</header>

<main class="gutter">
  <div class="list" id="view"></div>
</main>

<div class="toast" id="toast" role="status" hidden>
  <div class="gutter"><div class="msg"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden></button></div></div>
</div>

<input class="sr" id="file" type="file" accept="image/*" tabindex="-1" aria-label="Choose a photo">
<datalist id="people"></datalist>

<div class="jot" id="jot">
  <div class="gutter">
    <label class="sr" for="say">Say the round</label>
    <textarea class="input" id="say" rows="2" placeholder="Describe order with text or microphone… DON'T forget the COMMA! :)" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>
    <p class="err" id="err" role="alert"></p>
    <div class="quick">
      <button class="btn" id="qBeer" type="button" aria-label="Quick add a beer">🍺</button>
      <button class="btn" id="qMix" type="button" aria-label="Quick add a mixed drink">🍹</button>
      <button class="btn" id="qAgain" type="button" aria-label="Same again: repeat someone's last order">🔁</button>
      <button class="btn primary" id="split" type="button">Split into orders</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <section class="sheet q" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="sbody">
      <div>
        <h2 id="sTitle">Check these orders</h2>
        <p class="muted" id="sHint" style="font-size:15px;margin-top:4px"></p>
      </div>
      <div class="rows" id="rows"></div>
      <button class="btn block" id="more" type="button">Add another order</button>
    </div>
    <div class="sfoot">
      <p class="err" id="sErr" role="alert"></p>
      <div class="two">
        <button class="btn primary" id="sOk" type="button">Add</button>
        <button class="btn" id="sCancel" type="button">Cancel</button>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="qscrim" hidden>
  <section class="sheet q" role="dialog" aria-modal="true" aria-labelledby="qTitle">
    <div class="sbody">
      <h2 id="qTitle">Quick add</h2>
      <div class="pay" role="group" aria-label="Type of drink">
        <button class="seg big" id="kBeer" type="button" aria-pressed="true">🍺 Beer</button>
        <button class="seg big" id="kMix" type="button" aria-pressed="false">🍹 Mixed</button>
      </div>
      <div class="pay" id="qfmt" role="group" aria-label="Bottle or draft">
        <button class="seg big" id="fBottle" type="button" aria-pressed="false">Bottle</button>
        <button class="seg big" id="fDraft" type="button" aria-pressed="false">Draft</button>
      </div>
      <label class="flab" for="qDrink">Drink <span class="hint">type the first 3 letters</span>
        <input class="input" id="qDrink" type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Coo">
      </label>
      <div class="chips" id="qDrinkChips"></div>
      <div class="qrow" role="group" aria-labelledby="qQtyL">
        <span class="flab" id="qQtyL">How many</span>
        <div class="step">
          <button class="btn" id="qMinus" type="button" aria-label="One fewer">−</button>
          <input class="input" id="qQty" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="How many">
          <button class="btn" id="qPlus" type="button" aria-label="One more">+</button>
        </div>
      </div>
      <label class="flab" for="qWho">Who <span class="hint">a name, or what they look like</span>
        <input class="input" id="qWho" type="text" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false">
      </label>
      <div class="chips" id="qWhoChips"></div>
      <div class="pay" role="group" aria-label="How they pay">
        <button class="seg" id="qCash" type="button" aria-pressed="false">Cash</button>
        <button class="seg" id="qTab" type="button" aria-pressed="false">Tab</button>
      </div>
    </div>
    <div class="sfoot">
      <p class="err" id="qErr" role="alert"></p>
      <p id="qMsg" role="status" style="font-weight:700;color:var(--felt)"></p>
      <div class="two">
        <button class="btn primary" id="qAdd" type="button">Add order</button>
        <button class="btn" id="qAnother" type="button">Add another drink</button>
      </div>
      <div class="two">
        <button class="btn quiet" id="qHand" type="button">Fill in by hand</button>
        <button class="btn quiet" id="qCancel" type="button">Cancel</button>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="tscrim" hidden>
  <section class="sheet q" role="dialog" aria-modal="true" aria-labelledby="tTitle">
    <div class="sbody">
      <div>
        <h2 id="tTitle">Open tabs</h2>
        <p class="muted" style="font-size:15px;margin-top:4px">Everyone on a tab tonight and the drinks on it.</p>
      </div>
      <div class="rows" id="tList"></div>
    </div>
    <div class="sfoot">
      <div class="two">
        <button class="btn quiet" id="tClose" type="button">Close out the night</button>
        <button class="btn primary" id="tDone" type="button">Done</button>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="rscrim" hidden>
  <section class="sheet q" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <div class="sbody">
      <div>
        <h2 id="rTitle">Same again</h2>
        <p class="muted" style="font-size:15px;margin-top:4px">Tap Again to repeat what someone had last time. It lands on your list to ring in.</p>
      </div>
      <input class="input" id="rFind" type="search" placeholder="Find a name" aria-label="Find a name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p id="rMsg" role="status" style="font-weight:700;color:var(--felt)"></p>
      <div class="rows" id="rList"></div>
    </div>
    <div class="sfoot">
      <button class="btn primary block" id="rDone" type="button">Done</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function newId() { return "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function titleCase(s) { return s.replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  var KEY = "drinksScratchpad.v1";
  var S = { items: [], hist: [] }; /* hist: most recent first, [{who, what, photo, pay}] */
  var kept = true, warned = false, photoTarget = null;

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.items) && Array.isArray(p.hist)) S = p; }
  } catch (e) { kept = false; }
  if (!Array.isArray(S.drinks)) S.drinks = [];
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { kept = false; if (!warned) { warned = true; toast("Couldn't save that. The pad may clear if you close it."); } }
  }

  var toastTimer = null;
  function hideToast() { $("#toast").hidden = true; }
  function toast(msg, action) {
    var b = $("#toastBtn");
    $("#toastMsg").textContent = msg;
    if (action) { b.hidden = false; b.textContent = action.label; b.onclick = function () { hideToast(); action.fn(); }; }
    else { b.hidden = true; b.onclick = null; }
    $("#toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 6000 : 2800);
  }

  function findPerson(who) {
    if (!who) return null;
    var k = who.toLowerCase();
    for (var i = 0; i < S.hist.length; i++) if (S.hist[i].who.toLowerCase() === k) return S.hist[i];
    return null;
  }
  function remember(who, what, photo, pay, qty) {
    if (!who) return;
    var old = findPerson(who), now = Date.now();
    var keep = photo || (old && old.photo) || "";
    var lines = (old && old.lines) ? old.lines.slice() : [], lt = (old && old.lt) || 0;
    if (qty) { /* orders for one person within 20 minutes count as one round */
      if (!lines.length || now - lt > 20 * 60000) lines = [];
      var k = (what || "").toLowerCase(), hit = null;
      lines.forEach(function (l) { if (l.what.toLowerCase() === k) hit = l; });
      if (hit) hit.qty += qty; else lines.push({ what: what || "", qty: qty });
      lt = now;
    }
    S.hist = S.hist.filter(function (h) { return h.who.toLowerCase() !== who.toLowerCase(); });
    S.hist.unshift({ who: who, what: what || (old ? old.what : ""), photo: keep, pay: pay || (old && old.pay) || "", lines: lines, lt: lt });
    if (S.hist.length > 60) S.hist.length = 60;
  }

  function button(cls, text, fn, label) {
    var b = el("button", "btn " + cls, text);
    b.type = "button";
    if (label) b.setAttribute("aria-label", label);
    b.onclick = fn;
    return b;
  }

  /* ---------- Splitting a spoken round into orders ---------- */
  /* PARSE START */
  var NUM = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
    eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18,
    nineteen: 19, twenty: 20, dozen: 12, couple: 2, another: 1 };

  function tidyWho(s) {
    s = (s || "").trim();
    if (!s) return "";
    var known = findPerson(s);
    if (known) return known.who;
    if (/\b(the|a|an|with|in|at|by|near|over|on|from|and)\b/i.test(s)) return capFirst(s);
    return titleCase(s);
  }

  /* If the commas went missing, start a new order at a number that follows a "for ..." part. */
  function splitRuns(seg) {
    var words = seg.split(/\s+/), parts = [], cur = [], sawFor = false;
    var starters = /^(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|another)$/i;
    var blockers = /^(the|a|an|of|table|seat|at|by|to|with|and|number|no)$/i;
    words.forEach(function (w, i) {
      if (sawFor && cur.length && starters.test(w) && i + 1 < words.length && !blockers.test(words[i - 1])) {
        parts.push(cur.join(" ")); cur = []; sawFor = false;
      }
      cur.push(w);
      if (/^for$/i.test(w)) sawFor = true;
    });
    if (cur.length) parts.push(cur.join(" "));
    return parts;
  }

  function parseRound(text) {
    var segs = String(text).split(/\s*(?:[,;\n]+|\.(?!\d)|\band then\b|\bthen\b)\s*/i);
    var out = [], pieces = [];
    segs.forEach(function (s0) { splitRuns(s0).forEach(function (q) { pieces.push(q); }); });
    pieces.forEach(function (seg) {

  }
  function repeatFor(h, btn) {
    if (!h.pay) { $("#rMsg").style.color = "var(--danger)"; $("#rMsg").textContent = "Cash or tab? Add one order for " + h.who + " the usual way first."; return; }
    var lines = lastLines(h), now = Date.now();
    lines.forEach(function (l, i) { S.items.push({ id: newId(), who: h.who, what: l.what, qty: l.qty, pay: h.pay, stage: 0, t: now + i }); });
    persist(); render(); sizeJot();
    btn.disabled = true; btn.textContent = "Added";
    setTimeout(function () { btn.disabled = false; btn.textContent = "Again"; }, 1400);
    $("#rMsg").style.color = "var(--felt)";
    $("#rMsg").textContent = "Added " + lines.map(function (l) { return l.qty + " \u00d7 " + l.what; }).join(", ") + " for " + h.who + ".";
  }
  function openRepeat() {
    $("#rFind").value = ""; $("#rMsg").textContent = "";
    renderRepeat();
    $("#rscrim").hidden = false;
    document.documentElement.classList.add("lock");
    fitViewport();
    $("#rscrim .sbody").scrollTop = 0;
  }
  function closeRepeat() {
    $("#rscrim").hidden = true;
    document.documentElement.classList.remove("lock");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("#qAgain").addEventListener("click", openRepeat);
  $("#rDone").addEventListener("click", closeRepeat);
  $("#rFind").addEventListener("input", renderRepeat);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#rscrim").hidden) closeRepeat(); });

  /* ---------- Open tabs ---------- */
  var tClear = false;
  function tabGroups() {
    var g = {}, order = [];
    S.items.forEach(function (it) {
      if (it.pay !== "tab") return;
      var key = (it.who || "").trim().toLowerCase();
      if (!g[key]) { g[key] = { who: it.who || "No name", total: 0, lines: {}, lineOrder: [], unrung: 0 }; order.push(key); }
      var t = g[key], q = it.qty || 1, wk = (it.what || "").toLowerCase();
      t.total += q;
      if (!t.lines[wk]) { t.lines[wk] = { what: it.what || "", qty: 0 }; t.lineOrder.push(wk); }
      t.lines[wk].qty += q;
      if (!it.stage) t.unrung += q;
    });
    return order.map(function (k) { return g[k]; }).sort(function (a, b) { return a.who.localeCompare(b.who, undefined, { sensitivity: "base" }); });
  }
  function renderTabs() {
    var box = $("#tList");
    box.replaceChildren();
    $("#tClose").textContent = tClear ? "Tap again to clear tabs and pad" : "Close out the night";
    $("#tClose").classList.toggle("danger", tClear);
    var gs = tabGroups();
    if (!gs.length) { box.append(el("p", "muted", "No tabs yet tonight. Orders you mark Tab will show up here.")); return; }
    gs.forEach(function (g) {
      var c = el("article", "card"), row = el("div", "person");
      var person = findPerson(g.who), av = el("div", "av");
      if (person && person.photo) { var im = document.createElement("img"); im.src = person.photo; im.alt = ""; av.append(im); }
      else av.textContent = (g.who.charAt(0) || "?").toUpperCase();
      row.append(av);
      var body = el("div", "body");
      var nm = el("p", "name", g.who);
      nm.append(el("span", "pay-badge tab", g.total + (g.total === 1 ? " drink" : " drinks")));
      body.append(nm);
      g.lineOrder.forEach(function (k) {
        var l = g.lines[k], p = el("p", "tl");
        p.append(el("span", "qty", l.qty + " \u00d7"), document.createTextNode(" " + l.what));
        body.append(p);
      });
      if (g.unrung) { var u = el("p", "to"); u.append(el("b", null, "Not rung in"), document.createTextNode(String(g.unrung))); body.append(u); }
      row.append(body); c.append(row); box.append(c);
    });
  }
  function openTabs() {
    tClear = false; renderTabs();
    $("#tscrim").hidden = false;
    document.documentElement.classList.add("lock");
    fitViewport();
    $("#tscrim .sbody").scrollTop = 0;
  }
  function closeTabs() {
    tClear = false;
    $("#tscrim").hidden = true;
    document.documentElement.classList.remove("lock");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("#tabsBtn").addEventListener("click", openTabs);
  $("#tDone").addEventListener("click", closeTabs);
  $("#tClose").addEventListener("click", function () {
    if (!tClear) { tClear = true; renderTabs(); setTimeout(function () { if (tClear) { tClear = false; renderTabs(); } }, 4000); return; }
    var snap = S.items.slice();
    S.items = []; closeTabs(); persist(); render();
    toast("Closed out the night", { label: "Undo", fn: function () { S.items = snap; persist(); render(); } });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#tscrim").hidden) closeTabs(); });

  /* Keep the bottom bar and the sheets above the keyboard on iPhone. */
  function fitViewport() {
    var vv = window.visualViewport;
    if (!vv) return;
    $("#jot").style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px";
    document.querySelectorAll(".scrim").forEach(function (sc) {
      sc.style.top = vv.offsetTop + "px"; sc.style.height = vv.height + "px"; sc.style.bottom = "auto";
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitViewport);
    window.visualViewport.addEventListener("scroll", fitViewport);
  }
  $("#say").addEventListener("input", function () { $("#err").textContent = ""; });

  function sizeJot() {
    var h = $("#jot").getBoundingClientRect().height;
    document.documentElement.style.setProperty("--jot-h", Math.ceil(h) + "px");
  }

  /* Ask the phone to keep the screen on while the pad is showing. Some phones refuse; that is fine. */
  var lock = null;
  function holdAwake() {
    try {
      if (!navigator.wakeLock || document.hidden) return;
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l;
        l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !lock) holdAwake(); });
  document.addEventListener("click", function () { if (!lock) holdAwake(); });
  holdAwake();

  window.addEventListener("resize", sizeJot);
  render();
  sizeJot();
})();
</script>
</body>
</html>
